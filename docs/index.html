<style>
:root{
  --bg:#f6f5f0;--surface:#ffffff;--surface2:#eef2ec;--ink:#1d241f;--ink2:#4a5550;--muted:#7b857f;--line:#dfe3dc;
  --green:#2f6b4f;--green2:#4f8c6c;--green3:#a9cbb6;--green4:#dcebe1;--greenInk:#1f4d38;
  --warn:#b7791f;--warnBg:#fbf1dc;--bad:#b23a3a;--badBg:#f8e3e3;--ok:#2f6b4f;--okBg:#e1efe6;--info:#2b5f8a;--infoBg:#e0ebf5;
  --amber:#c9a227;--sans:"Inter","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--radius:12px;--shadow:0 1px 2px rgba(20,30,24,.06),0 4px 14px rgba(20,30,24,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917;--surface:#1c2320;--surface2:#232c28;--ink:#e8ece9;--ink2:#b8c2bc;--muted:#86918b;--line:#2f3a34;
  --green:#5fa583;--green2:#7fbf9c;--green3:#3f6f56;--green4:#25382e;--greenInk:#bfe3cf;
  --warn:#e2b14e;--warnBg:#3a2f14;--bad:#e07070;--badBg:#3d2020;--ok:#5fa583;--okBg:#1f3328;--info:#7fb2dc;--infoBg:#1b2d3d;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#141917;--surface:#1c2320;--surface2:#232c28;--ink:#e8ece9;--ink2:#b8c2bc;--muted:#86918b;--line:#2f3a34;
  --green:#5fa583;--green2:#7fbf9c;--green3:#3f6f56;--green4:#25382e;--greenInk:#bfe3cf;
  --warn:#e2b14e;--warnBg:#3a2f14;--bad:#e07070;--badBg:#3d2020;--ok:#5fa583;--okBg:#1f3328;--info:#7fb2dc;--infoBg:#1b2d3d;--shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5}
a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}
header{background:var(--green);color:#fff;padding:0 16px}
.hwrap{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding:8px 0}
.brand{font-weight:700;font-size:17px;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--green);display:grid;place-items:center;font-weight:800}
.hmeta{margin-left:auto;font-size:12.5px;opacity:.92;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hmeta .pill{background:rgba(255,255,255,.16);padding:3px 9px;border-radius:999px}
.hmeta button{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 11px;cursor:pointer;font:inherit;font-size:12.5px}
nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.nwrap{max-width:1280px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 8px}
.tab{padding:12px 14px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab.active{color:var(--green);border-color:var(--green)}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
section.page{display:none}section.page.active{display:block}
h2{font-size:17px;margin:22px 0 10px;font-weight:650}h2:first-child{margin-top:4px}
h3{font-size:14.5px;margin:16px 0 8px;font-weight:650;color:var(--ink2)}
.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(4,1fr)}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi[onclick]{cursor:pointer}.kpi[onclick]:hover{border-color:var(--green3);box-shadow:0 2px 10px rgba(47,107,79,.15)}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.1}.kpi .l{color:var(--muted);font-size:12.5px;margin-top:4px}
.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}.kpi.info .v{color:var(--info)}.kpi.ok .v{color:var(--green)}
.two{grid-template-columns:1fr 1fr}@media(max-width:900px){.two{grid-template-columns:1fr}}
.three{grid-template-columns:2fr 1fr 1fr}@media(max-width:1000px){.three{grid-template-columns:1fr}}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap;vertical-align:middle}
.b-high{background:var(--badBg);color:var(--bad)}.b-medium{background:var(--warnBg);color:var(--warn)}.b-low{background:var(--surface2);color:var(--ink2)}
.b-green{background:var(--green4);color:var(--greenInk)}.b-info{background:var(--infoBg);color:var(--info)}.b-muted{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.b-core{background:var(--green4);color:var(--greenInk)}.b-reference{background:var(--surface2);color:var(--ink2)}.b-watch{background:var(--warnBg);color:var(--warn)}
.item{padding:12px 0;border-top:1px solid var(--line)}.item:first-child{border-top:none;padding-top:4px}
.item .t{font-weight:600;line-height:1.35}.item .m{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .x{color:var(--ink2);margin-top:5px;font-size:13.5px}
.stars{color:var(--amber);letter-spacing:1px;font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
select,input[type=search]{font:inherit;font-size:13.5px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input[type=search]{min-width:200px}
label.chk{font-size:13px;color:var(--ink2);display:inline-flex;gap:5px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.delta-neg{color:var(--bad)}.delta-pos{color:var(--green)}
.twrap{overflow-x:auto}
.chart{width:100%;height:auto;display:block}
.bar-row{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar-row .bar{height:10px;border-radius:0 4px 4px 0;background:var(--green2)}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.small{font-size:12.5px;color:var(--muted)}
.model-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.model-head .band{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--surface)}
.chip.core{border-color:var(--green3);background:var(--green4);color:var(--greenInk)}.chip.watch{border-style:dashed}
.note{background:var(--surface2);border-left:3px solid var(--green);padding:8px 12px;border-radius:6px;font-size:13px;color:var(--ink2);margin:8px 0}
.status-ok{color:var(--green)}.status-bad{color:var(--bad)}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.alert:first-child{border-top:none}
.ddiff{font-family:var(--mono);font-size:12px;white-space:pre-wrap;background:var(--surface2);padding:8px 10px;border-radius:8px;max-height:220px;overflow:auto}
.ddiff .add{color:var(--green)}.ddiff .rem{color:var(--bad)}
details summary{cursor:pointer;color:var(--ink2);font-size:13px}
.btn{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer}
.btn.active{background:var(--green4);color:var(--greenInk);border-color:var(--green3)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:30px 0 10px}
.loading{color:var(--muted);padding:40px;text-align:center}
.tag{font-family:var(--mono);font-size:11.5px;background:var(--surface2);padding:1px 6px;border-radius:5px;color:var(--ink2)}

.mstrip{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:6px;max-width:240px}
.mcell{border:1px solid var(--line);border-radius:3px;padding:1px 0 2px;text-align:center;font-size:9px;line-height:1.1;color:var(--muted);min-height:20px;white-space:nowrap}
.mcell.has{background:var(--green4);color:var(--greenInk)}.mcell.cur{outline:1.5px solid var(--green)}
.mcell .dots{display:flex;justify-content:center;gap:1px;margin-top:1px}.mcell .dots i{display:block;width:5px;height:5px;border-radius:50%}
.gantt{width:100%;min-width:1000px;height:auto;display:block}
.tlt th{vertical-align:top}.tlt{table-layout:fixed;width:100%}.tlt td{vertical-align:top;font-size:11.5px;word-break:break-word}.tlt tr.curm th{color:var(--green);}.tlt tr.curm td{background:var(--green4)}.tlc{margin-bottom:5px;line-height:1.35}

/* ---- mobile ---- */
.grid>*{min-width:0}.twrap{max-width:100%;-webkit-overflow-scrolling:touch}.card{min-width:0;overflow:hidden}
.nwrap{scrollbar-width:none;-ms-overflow-style:none}.nwrap::-webkit-scrollbar{display:none}
table.sticky th:first-child,table.sticky td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
@media(max-width:640px){
  html,body{font-size:14px}
  .hwrap{min-height:0;padding:8px 0;gap:8px}.brand{font-size:15.5px;flex:1 1 auto}.brand .mark{width:26px;height:26px}
  .hmeta{margin-left:0;width:100%;gap:6px;font-size:11.5px}.hmeta .pill{padding:2px 8px}#nextrun{display:none}
  .hmeta button{padding:3px 9px;font-size:11.5px}#langBtn{margin-left:auto}#whoami{margin-left:auto}#whoami+#langBtn{margin-left:0}
  nav{box-shadow:0 2px 6px rgba(0,0,0,.05)}.nwrap{padding:0 4px;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
  .tab{padding:11px 11px;font-size:13.5px}
  main{padding:12px 10px 48px}.card{padding:12px 12px;border-radius:10px}
  h2{font-size:15.5px;margin:16px 0 8px}h3{font-size:13.5px}
  .kpis{gap:8px}.kpi{padding:10px 12px}
  .filters{gap:6px}.filters select,.filters input{max-width:100%;font-size:13px}
  .note{font-size:12.5px;padding:8px 10px}
  table{font-size:12.5px}th,td{padding:6px 7px}th{white-space:nowrap}
  .twrap{position:relative;margin:0 -12px;padding:0 12px}.twrap table{min-width:100%}
  .twrap.hint::after{content:attr(data-hint);display:block;font-size:11px;color:var(--muted);padding:4px 0 0}
  .gantt{min-width:900px}.tlt td{min-width:160px}
  .mstrip{max-width:100%}
  .item .t{font-size:13.5px}.item .m{font-size:11.5px;flex-wrap:wrap;gap:4px 8px}
  .bar-row{grid-template-columns:120px 1fr 44px!important;font-size:12px}
  footer{font-size:11.5px;padding:14px 12px}
}
</style>

let lang = 'zh'; try{ lang = localStorage.getItem('zw.lang') || 'zh'; }catch(e){}
const T = k => (I18N[lang][k] ?? I18N.zh[k] ?? k);
const D = {};  // data
const fmtMoney = v => v==null ? '—' : '$' + Number(v).toLocaleString('en-AU');
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tz = 'Australia/Sydney';
function fmtTime(iso, withTime=true){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return iso; return d.toLocaleString(lang==='zh'?'zh-CN':'en-AU',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',...(withTime?{hour:'2-digit',minute:'2-digit',hour12:false}:{})}); }
function ago(iso){ if(!iso) return ''; const h=(Date.now()-new Date(iso))/36e5; if(h<1) return lang==='zh'?`${Math.max(1,Math.round(h*60))} 分钟前`:`${Math.max(1,Math.round(h*60))} min ago`; if(h<48) return lang==='zh'?`${Math.round(h)} 小时前`:`${Math.round(h)} h ago`; return lang==='zh'?`${Math.round(h/24)} 天前`:`${Math.round(h/24)} d ago`; }
const stars = r => r==null?'':`<span class="stars" title="${r}">${'★'.repeat(Math.round(r))}${'☆'.repeat(5-Math.round(r))}</span>`;
const sevBadge = s => s?`<span class="badge b-${s}">${T('sev_'+s)}</span>`:'';
const modelName = k => (D.zeekr.models.find(m=>m.key===k)||{}).name || k;
const catName = k => { const c=D.summary.categories_30d.find(x=>x.key===k); return c ? (lang==='zh'?c.zh:c.en) : CATS[k]?.[lang] || k; };
const CATS = {quality:{zh:"质量/故障",en:"Quality / faults"},software:{zh:"软件/APP/车机",en:"Software / app"},charging:{zh:"充电/续航/电池",en:"Charging / range"},delivery:{zh:"交付/等待/订单",en:"Delivery / orders"},service:{zh:"售后/服务/保修",en:"After-sales / warranty"},price:{zh:"价格/贬值/退款",en:"Price / resale"},safety:{zh:"召回/安全",en:"Recall / safety"},sales:{zh:"销售体验",en:"Sales experience"}};
const sigBadge = s => ({launch:'b-info',offer:'b-green',price_cut:'b-high',price_rise:'b-medium',price:'b-muted'}[s]) ? `<span class="badge ${({launch:'b-info',offer:'b-green',price_cut:'b-high',price_rise:'b-medium',price:'b-muted'})[s]}">${T({launch:'launch',offer:'offer',price_cut:'cut',price_rise:'rise',price:'price'}[s])}</span>` : '';
const compName = id => { const c=D.comps.competitors.find(x=>x.id===id); return c ? `${c.brand} ${c.model}` : id; };
const itemTime = it => it.published || it.first_seen;
const WIN_H = {'24h':24,'7d':24*7,'30d':24*30};
const inWin = (it,win) => !win || (Date.now()-new Date(itemTime(it)))<=WIN_H[win]*36e5;
const isAU = it => it.au!==false;
const winSel = (id,cur) => `<select id="${id}"><option value="">${T('f_win')}: ${T('f_all')}</option>${['24h','7d','30d'].map(w=>`<option value="${w}" ${cur===w?'selected':''}>${T('w'+w.replace('h','').replace('d',''))}</option>`).join('')}</select>`;

function renderItem(it, opts={}){
  const meta = [];
  if(it.severity) meta.push(sevBadge(it.severity));
  if(it.rating!=null) meta.push(stars(it.rating));
  meta.push(`<span>${esc(it.source_name)}</span>`);
  meta.push(`<span title="${esc(itemTime(it))}">${fmtTime(itemTime(it))} · ${ago(itemTime(it))}</span>`);
  if(it.au===false) meta.push(`<span class="badge b-muted">non-AU</span>`);
  (it.models||[]).forEach(m=>meta.push(`<span class="badge b-green">${esc(modelName(m))}</span>`));
  if(it.type!=='competitor_news') (it.categories||[]).slice(0,3).forEach(c=>meta.push(`<span class="badge b-muted">${esc(catName(c))}</span>`));
  (it.signals||[]).forEach(s=>meta.push(sigBadge(s)));
  if(opts.comps) (it.competitors||[]).slice(0,4).forEach(c=>meta.push(`<span class="badge b-green">${esc(compName(c))}</span>`));
  const x = it.text && it.text!==it.title && !(it.source==='' ) && it.text.replace(/\W/g,'').toLowerCase()!==(it.title+it.source_name.split(' · ').pop()).replace(/\W/g,'').toLowerCase() ? `<div class="x">${esc(it.text.slice(0,260))}${it.text.length>260?'…':''}</div>` : '';
  return `<div class="item"><div class="t"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title||'(untitled)')}</a></div><div class="m">${meta.join('')}</div>${x}</div>`;
}

function barChart(series){
  const w=720,h=190,padL=30,padB=24,padT=10; const n=series.length; const max=Math.max(1,...series.map(s=>s.complaints));
  const bw=(w-padL-8)/n; let bars='', ticks='';
  series.forEach((s,i)=>{ const x=padL+i*bw; const bh=(h-padB-padT)*s.complaints/max; const y=h-padB-bh;
    bars+=`<rect x="${x+1}" y="${y}" width="${Math.max(2,bw-3)}" height="${bh}" rx="2" fill="var(--green2)"><title>${s.date}: ${s.complaints}</title></rect>`;
    if(i%5===0||i===n-1) ticks+=`<text x="${x+bw/2}" y="${h-6}" font-size="10" text-anchor="middle" fill="var(--muted)">${s.date.slice(5)}</text>`; });
  const gy=[0,Math.ceil(max/2),max].map(v=>{const y=h-padB-(h-padB-padT)*v/max; return `<line x1="${padL}" x2="${w}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${padL-4}" y="${y+3}" font-size="10" text-anchor="end" fill="var(--muted)">${v}</text>`;}).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="complaints per day">${gy}${bars}${ticks}</svg>`;
}
function hbars(pairs){ const max=Math.max(1,...pairs.map(p=>p[1])); return pairs.map(p=>`<div class="bar-row"><div title="${esc(p[0])}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p[0])}</div><div><div class="bar" style="width:${100*p[1]/max}%"></div></div><div class="n">${p[1]}</div></div>`).join('') || `<div class="small">—</div>`; }

function openComplaints(o){ Object.assign(F,{model:'',cat:'',sev:'',src:'',q:'',au:true,win:''},o); renderComplaints(); go('complaints'); }

const hasOffer = i => i.signals.includes('offer')||i.signals.includes('price')||i.signals.includes('price_cut')||i.signals.includes('price_rise');

  if(L.model) { const ids=compsFor(L.model); pool = pool.filter(i=>i.competitors.some(c=>ids.includes(c))); }

function nearestDelta(price, zm){
  const vs = zm.variants.filter(v=>v.rrp); if(!vs.length||price==null) return '';
  let best=vs[0]; for(const v of vs) if(Math.abs(v.rrp-price)<Math.abs(best.rrp-price)) best=v;
  const d=price-best.rrp; const cls=d<0?'delta-neg':'delta-pos';
  return `<span class="${cls}">${d>=0?'+':'−'}${fmtMoney(Math.abs(d)).replace('$','$')}</span> <span class="small">vs ${esc(best.name)}</span>`;
}
function renderPrices(){

  const html = D.zeekr.models.map(zm=>{
    const comps=D.comps.competitors.filter(c=>c.zeekr.includes(zm.key)).sort((a,b)=>tierOrder[a.tier]-tierOrder[b.tier]||(a.variants[0]?.price||9e9)-(b.variants[0]?.price||9e9));
    const ztbl=`<div class="twrap"><table><thead><tr><th>${T('p_variant')}</th><th>${T('p_drive')}</th><th>${T('p_batt')}</th><th class="num">${T('p_price')}</th></tr></thead><tbody>${zm.variants.map(v=>`<tr><td>${esc(v.name)}</td><td>${esc(v.drive)}</td><td>${v.battery_kwh} kWh</td><td class="num">${v.rrp?fmtMoney(v.rrp):'TBA'}</td></tr>`).join('')}</tbody></table></div>${zm.note?`<div class="note">${esc(zm.note)}</div>`:''}`;
    const rows=comps.map(c=>{ const sig=D.summary.competitor_signals[c.id]||{}; const news=D.items.filter(i=>i.type==='competitor_news'&&i.competitors.includes(c.id)).slice(0,3);
      const sigHtml = news.map(n=>`<div class="small">${n.signals.map(sigBadge).join('')} <a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title.slice(0,70))}</a> <span class="small">${fmtTime(itemTime(n),false)}</span></div>`).join('') || '<span class="small">—</span>';
      const offers = (c.offers||[]).map(o=>`<div class="small">• ${esc(o.text)}${o.valid?` <span class="tag">${esc(o.valid)}</span>`:''}${o.src?` <a href="${esc(o.src)}" target="_blank" rel="noopener">↗</a>`:''}</div>`).join('') || '<span class="small">—</span>';
      const vs = c.variants.length?c.variants:[{name:'—',drive:'',kwh:null,price:null,basis:'rrp'}];
      return vs.map((v,i)=>`<tr>${i===0?`<td rowspan="${vs.length}"><b>${esc(c.brand)} ${esc(c.model)}</b><div><span class="badge b-${c.tier}">${T('tier_'+c.tier)}</span>${c.group_flag?` <span class="badge b-muted" title="${esc(c.group_flag)}">${T('group')}</span>`:''}</div><div class="small">${esc(c.body)} · ${esc(c.powertrain)} · ${c.status==='on_sale'?T('st_on_sale'):(c.status==='launching'?T('st_launching'):T('st_watch'))}${c.au_launch?' · '+esc(c.au_launch):''}</div>${c.price_note?`<div class="small">${esc(c.price_note)}</div>`:''}<div class="small">${c.model_url?`<a href="${esc(c.model_url)}" target="_blank" rel="noopener">${lang==='zh'?'官网':'site'}</a>`:''} ${c.offers_url?`· <a href="${esc(c.offers_url)}" target="_blank" rel="noopener">${lang==='zh'?'政策页':'offers'}</a>`:''}</div>${window.monthStrip?monthStrip(c.id):''}</td>`:''}<td>${esc(v.name)}</td><td>${esc(v.drive||'')}</td><td>${v.kwh?v.kwh+' kWh':''}</td><td class="num">${v.price?fmtMoney(v.price):'TBA'}${v.price?`<div class="small">${v.basis==='da'?T('basis_da'):'MSRP'}</div>`:''}</td><td>${nearestDelta(v.price,zm)}</td>${i===0?`<td rowspan="${vs.length}">${offers}</td><td rowspan="${vs.length}">${sigHtml}</td>`:''}</tr>`).join('');
    }).join('');
    return `<div class="card" style="margin-top:12px"><div class="model-head"><h2 style="margin:0">${esc(zm.name)}</h2><span class="band">${esc(lang==='zh'?zm.segment:zm.segment_en)} · ${fmtMoney(zm.price_band[0])}–${fmtMoney(zm.price_band[1])}${zm.price_band_note?' ('+esc(zm.price_band_note)+')':''}</span></div>
      <h3>${T('p_zeekr')}</h3>${ztbl}
      <h3>${lang==='zh'?'竞品价格与政策':'Competitor prices & offers'}</h3><div class="twrap hint" data-hint="${lang==='zh'?'表格可左右滑动':'Swipe sideways to see more'}"><table class="sticky"><thead><tr><th>${lang==='zh'?'竞品':'Competitor'}</th><th>${T('p_variant')}</th><th>${T('p_drive')}</th><th>${T('p_batt')}</th><th class="num">${T('p_price')}</th><th>${T('p_delta')}</th><th>${T('p_offer')}</th><th>${T('p_signal')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }).join('');
  const changes = (D.changes||[]).slice(0,40).map(c=>`<details class="item"><summary><b>${esc(c.brand)}</b> · ${fmtTime(c.detected)} · +${c.added.length} / −${c.removed.length} · <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url.replace(/^https?:\/\//,''))}</a></summary><div class="ddiff">${c.added.map(l=>`<div class="add">+ ${esc(l)}</div>`).join('')}${c.removed.map(l=>`<div class="rem">− ${esc(l)}</div>`).join('')}</div></details>`).join('');
  const snaps = Object.values(D.snaps||{}).map(s=>`<tr><td>${esc(s.brand)}</td><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc((s.url||'').replace(/^https?:\/\//,''))}</a></td><td>${s.fetched?fmtTime(s.fetched):'—'}</td><td>${s.last_error?`<span class="status-bad small">${esc(s.last_error)}</span>`:`<span class="status-ok">${s.n_lines??''} ${lang==='zh'?'行':'lines'}</span>`}</td><td class="small">${(s.money||[]).slice(0,8).map(fmtMoney).join(', ')}</td></tr>`).join('');
  document.getElementById('prices').innerHTML = `<div class="note">${lang==='zh'?'基准价格与政策由人工核定（2026-10-13，来源见各行链接），抓取程序在此之上叠加新闻信号与品牌官网政策页面的变化检测。价格口径：MSRP = 厂商指导价（不含上路费用）；DAP = 上路价（drive-away price）。每个竞品行下方的 12 格为 2026 年逐月政策条（颜色 = 政策类型，详见“政策时间线 2026”页）。':'Baseline prices and offers were verified manually on 2026-10-13 (see links). The collector overlays news signals and change detection on brand offer pages. MSRP = list price before on-road costs; DAP = drive-away price. The 12-cell strip under each competitor is its 2026 month-by-month policy record (colour = policy type; see the Policy timeline tab).'}</div>
   ${html}
   <div class="card" id="pchanges" style="margin-top:12px"><h2>${T('p_changes')}</h2>${changes || `<div class="small">${T('p_nochange')}</div>`}
   <h3>${lang==='zh'?'监控的品牌页面（最近快照）':'Monitored brand pages (latest snapshot)'}</h3><div class="twrap"><table><thead><tr><th>${lang==='zh'?'品牌':'Brand'}</th><th>URL</th><th>${lang==='zh'?'抓取时间':'Fetched'}</th><th>${T('s_status')}</th><th>${lang==='zh'?'页面上的金额':'Amounts on page'}</th></tr></thead><tbody>${snaps}</tbody></table></div></div>`;
}

function renderMatrix(){
  const html = D.zeekr.models.map(zm=>{ const comps=D.comps.competitors.filter(c=>c.zeekr.includes(zm.key));
    const grp = t => comps.filter(c=>c.tier===t).map(c=>`<span class="chip ${c.tier}" title="${esc(lang==='zh'?c.fit:c.fit_en)}">${esc(c.brand)} ${esc(c.model)}${c.variants[0]?.price?` <span class="small">${fmtMoney(Math.min(...c.variants.filter(v=>v.price).map(v=>v.price)))}+</span>`:''}</span>`).join('');
    return `<div class="card" style="margin-top:12px"><div class="model-head"><h2 style="margin:0">${esc(zm.name)}</h2><span class="tag">${esc(zm.code)}</span><span class="band">${zm.status==='on_sale'?T('st_on_sale'):esc(zm.expected_launch||T('st_launching'))}</span></div>
      <div class="grid two" style="margin-top:8px"><div><div><b>${T('m_seg')}</b>: ${esc(lang==='zh'?zm.segment:zm.segment_en)} · ${esc(zm.powertrain)}</div><div><b>${T('m_band')}</b>: ${fmtMoney(zm.price_band[0])}–${fmtMoney(zm.price_band[1])} ${zm.price_band_note?`<span class="small">(${esc(zm.price_band_note)})</span>`:''}</div><div><b>${T('m_use')}</b>: ${esc(lang==='zh'?zm.use_case:zm.use_case_en)}</div></div>
      <div><div><b>${T('m_comps')}</b></div><div class="small" style="margin-top:4px">${T('tier_core')}</div><div class="chips">${grp('core')||'—'}</div><div class="small" style="margin-top:6px">${T('tier_reference')}</div><div class="chips">${grp('reference')||'—'}</div><div class="small" style="margin-top:6px">${T('tier_watch')}</div><div class="chips">${grp('watch')||'—'}</div></div></div>
      <details style="margin-top:10px"><summary>${lang==='zh'?'对标理由':'Why these rivals'}</summary><table style="margin-top:6px"><tbody>${comps.map(c=>`<tr><td style="white-space:nowrap"><b>${esc(c.brand)} ${esc(c.model)}</b> <span class="badge b-${c.tier}">${T('tier_'+c.tier)}</span></td><td>${esc(lang==='zh'?c.fit:c.fit_en)}</td></tr>`).join('')}</tbody></table></details></div>`; }).join('');
  document.getElementById('matrix').innerHTML = `<div class="note">${lang==='zh'?'对标原则：价格区间重叠、车身形式与用途相近、品牌调性匹配（高端/新高端）。主流品牌仅作为价格参照列出；集团内车型标注"集团内"，用于内部分流检查。':'Selection rule: overlapping price band, similar body style and use case, matching brand tone (premium / new-premium). Mainstream brands appear only as price references; Geely-group models are flagged for cannibalisation checks.'}</div>${html}`;
}

function renderSources(){
  const st=D.summary.source_status; const keys=Object.keys(st).sort((a,b)=>(st[a].ok===st[b].ok?0:(st[a].ok?1:-1))||a.localeCompare(b));
  const rows=keys.map(k=>`<tr><td><span class="tag">${esc(k)}</span></td><td class="${st[k].ok?'status-ok':'status-bad'}">${st[k].ok?'OK':'FAIL'}</td><td class="num">${st[k].count}</td><td class="small">${esc(st[k].note||'')}</td></tr>`).join('');
  const runs=(D.runs||[]).slice(0,30).map(r=>`<tr><td>${fmtTime(r.t)}</td><td class="num">${r.duration_s}s</td><td class="num">${r.new}</td><td class="num">${r.sources_ok}/${r.sources_total}</td></tr>`).join('');
  document.getElementById('sources').innerHTML = `<div class="note">${T('s_intro')}</div>
  <div class="grid two"><div class="card"><h2>${T('s_source')}</h2><div class="twrap"><table><thead><tr><th>${T('s_source')}</th><th>${T('s_status')}</th><th class="num">${T('s_count')}</th><th>${T('s_note')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="card"><h2>${T('s_runs')}</h2><div class="twrap"><table><thead><tr><th>${T('s_time')}</th><th class="num">${T('s_dur')}</th><th class="num">${T('s_new')}</th><th class="num">${T('s_ok')}</th></tr></thead><tbody>${runs}</tbody></table></div>
  <h3>${lang==='zh'?'可选凭证（仓库 Secrets）':'Optional credentials (repo secrets)'}</h3><ul class="small"><li><b>GOOGLE_MAPS_API_KEY</b> — ${lang==='zh'?'Google 地图门店评价（Places API，每 6 小时）':'Google Maps store reviews (Places API, every 6 h)'}</li><li><b>REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET</b> — ${lang==='zh'?'Reddit 官方 API，避免匿名抓取被限流（429）':'Reddit API, avoids anonymous rate limits (429)'}</li></ul></div></div>`;
}

function renderAll(){
  document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent=T(el.dataset.i); });
  document.documentElement.lang = lang==='zh'?'zh-CN':'en-AU'; document.title=T('title');
  document.getElementById('langBtn').textContent = lang==='zh'?'EN':'中文';
  const g=D.summary.generated; document.getElementById('updated').textContent=`${T('updated')} ${fmtTime(g)} (${ago(g)})`;
  const nx=new Date(new Date(g).getTime()+30*60000); document.getElementById('nextrun').textContent=`${T('next')} ${nx.toLocaleTimeString(lang==='zh'?'zh-CN':'en-AU',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false})}`;
  renderOverview(); renderComplaints(); renderLaunches(); renderPrices(); renderMatrix(); renderSources();
  if(window.renderTimeline) renderTimeline(); if(window.renderBenchmark) renderBenchmark();
}
function go(tab){ document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab)); document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===tab)); try{localStorage.setItem('zw.tab',tab);}catch(e){} window.scrollTo({top:0}); }
document.getElementById('tabs').addEventListener('click',e=>{ const t=e.target.closest('.tab'); if(t) go(t.dataset.tab); });
document.getElementById('langBtn').onclick=()=>{ lang=lang==='zh'?'en':'zh'; try{localStorage.setItem('zw.lang',lang);}catch(e){} renderAll(); };
document.getElementById('themeBtn').onclick=()=>{ const r=document.documentElement; const cur=r.getAttribute('data-theme'); const next=cur==='dark'?'light':(cur==='light'?'':'dark'); if(next) r.setAttribute('data-theme',next); else r.removeAttribute('data-theme'); try{localStorage.setItem('zw.theme',next);}catch(e){} };
try{ const th=localStorage.getItem('zw.theme'); if(th) document.documentElement.setAttribute('data-theme',th); }catch(e){}

let AUTH = null;  // docs/auth.json: {users:[{u, h}]}, h = sha256(lowercase(username) + ":" + password)
async function loadAuth(){ if(AUTH) return AUTH; try{ const r=await fetch('auth.json?t='+Date.now()); AUTH = r.ok ? await r.json() : {users:[]}; }catch(e){ AUTH={users:[]}; } return AUTH; }
async function sha256(t){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function userOf(h){ return ((AUTH&&AUTH.users)||[]).find(x=>x.h===h); }
async function gateOK(){ await loadAuth(); try{ const h=localStorage.getItem('zw.auth'); const u=userOf(h); if(u){ showUser(u); return true; } }catch(e){} return false; }
function showUser(u){ const el=document.getElementById('whoami'); if(el){ el.textContent=u.name||u.u; el.style.display=''; } }
function showGate(){ const g=document.getElementById('gate'); g.style.display='grid'; document.getElementById('loading').style.display='none';
  document.getElementById('gateT').textContent=T('login_t'); document.getElementById('gateP').textContent=T('login_p'); document.getElementById('gateB').textContent=T('login_b');
  document.getElementById('gateUser').placeholder=T('login_u'); document.getElementById('gatePw').placeholder=T('login_pw');
  document.getElementById('gateForm').onsubmit=async e=>{ e.preventDefault(); await loadAuth(); const un=document.getElementById('gateUser').value.trim().toLowerCase(); const pw=document.getElementById('gatePw').value; const h=await sha256(un+':'+pw); const u=userOf(h);
    if(u){ try{localStorage.setItem('zw.auth',h);}catch(x){} showUser(u); g.style.display='none'; document.getElementById('loading').style.display=''; load().catch(err=>{ document.getElementById('loading').textContent='Load failed: '+err.message; }); }
    else { document.getElementById('gateE').textContent=T('login_e'); document.getElementById('gatePw').value=''; } };
  setTimeout(()=>document.getElementById('gateUser').focus(),50); }
function logout(){ try{localStorage.removeItem('zw.auth');}catch(e){} location.reload(); }
async function load(){
  const t=Date.now(); const j=async n=>{ const r=await fetch(`data/${n}.json?t=${t}`); if(!r.ok) throw new Error(n+': '+r.status); return r.json(); };
  const opt=async n=>{ try{ return await j(n);}catch(e){ return null; } };
  [D.summary,D.items,D.zeekr,D.comps] = await Promise.all([j('summary'),j('items'),j('zeekr'),j('competitors')]);
  [D.changes,D.snaps,D.runs,D.places,D.policy,D.dap,D.german,D.bench] = await Promise.all([opt('offer_changes'),opt('offer_snapshots'),opt('runs'),opt('places'),opt('policy_events'),opt('dap_history'),opt('german_evidence'),opt('benchmark')]);
  D.bench = D.bench || {};
  document.getElementById('loading').style.display='none';
  renderAll();
  try{ const tb=localStorage.getItem('zw.tab'); if(tb) go(tb); }catch(e){}
}
gateOK().then(ok=>{ if(ok) load().catch(e=>{ document.getElementById('loading').textContent='Load failed: '+e.message; }); else showGate(); });
</script>
